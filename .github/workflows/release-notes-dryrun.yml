name: Release notes dry-run

# Manual smoke test for the Claude release-notes integration.
#
# Runs `claude-release-notes` against an existing tag with `apply: false` —
# no release body is touched. Exercises the full Cloudflare AI Gateway +
# Key Vault + Claude path end-to-end, so a green run confirms the gateway
# is reachable and the workflow is wired correctly. Use it to:
#   - Validate the gateway after rotation / outage / config changes.
#   - Sanity-check notes quality on a sample release before relying on the
#     auto-generated bodies in production.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to generate notes for (e.g. 'aspnetcore-5.1.0')."
        required: true
        type: string
      previous-tag:
        description: "Optional. Tag to diff against. Leave blank to auto-detect via the chart prefix."
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: read

jobs:
  prefix:
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.prefix.outputs.prefix }}
    steps:
      - name: Derive tag prefix
        id: prefix
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $i = $env:TAG.LastIndexOf('-')
          if ($i -lt 0) {
              Write-Error "Tag '$env:TAG' has no '-' separator; expected '<chart>-<semver>'."
              exit 1
          }
          $prefix = $env:TAG.Substring(0, $i + 1)
          "prefix=$prefix" >> $env:GITHUB_OUTPUT
          Write-Host "Derived tag-prefix '$prefix' from tag '$env:TAG'."

  notes:
    name: Generate release notes with Claude (dry-run)
    needs: prefix
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    uses: workleap/wl-github-actions/.github/workflows/claude-release-notes.yml@latest
    with:
      tag: ${{ inputs.tag }}
      previous-tag: ${{ inputs.previous-tag }}
      tag-prefix: ${{ needs.prefix.outputs.prefix }}
      apply: false

  summary:
    name: Publish notes to job summary
    needs: notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download notes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.notes.outputs.artifact-name }}

      - name: Publish notes to job summary
        env:
          TAG: ${{ inputs.tag }}
          PREVIOUS_TAG: ${{ needs.notes.outputs.previous-tag }}
        run: |
          {
            echo "# Dry-run release notes"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo '| Tag | `'"$TAG"'` |'
            echo '| Previous tag | `'"$PREVIOUS_TAG"'` |'
            echo "| Applied to release | no (dry-run) |"
            echo
            echo "---"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
