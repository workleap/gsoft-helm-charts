name: Release charts

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["charts/**/*"]

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    runs-on: [idp]
    outputs:
      new-tags: ${{ steps.find-new-tags.outputs.tags }}
    steps:
      - name: Get Secrets from Azure Key Vault
        id: get_secret
        uses: workleap/wl-reusable-workflows/retrieve-managed-secret@main
        with:
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          keyvault-name: ${{ vars.IDP_CICD_KEYVAULT_NAME }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.get_secret.outputs.secret }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.21.4

      - name: Snapshot tags before release
        id: tags-before
        shell: pwsh
        run: |
          $tags = @(git tag)
          $json = ConvertTo-Json -Compress -InputObject $tags -AsArray
          "tags=$json" >> $env:GITHUB_OUTPUT
          Write-Host "Snapshotted $($tags.Count) existing tags."

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ steps.get_secret.outputs.secret }}"
          CR_PAGES_BRANCH: "gh-pages"
          CR_PAGES_INDEX_PATH: "pages/index.yaml"
          CR_SKIP_EXISTING: "true"
          # Ask GitHub to auto-generate release notes from merged PRs in the
          # tag range. chart-releaser binds this to the cr CLI's
          # --generate-release-notes flag via viper (env prefix CR_, '-' -> '_').
          # Categorization is driven by .github/release.yml. The release-notes
          # job below overwrites these bodies with Claude-generated notes —
          # CR's output stays as a fallback if the Claude job fails.
          CR_GENERATE_RELEASE_NOTES: "false"

      - name: Find new tags
        id: find-new-tags
        shell: pwsh
        env:
          BEFORE: ${{ steps.tags-before.outputs.tags }}
        run: |
          git fetch --tags --quiet
          $before = ConvertFrom-Json $env:BEFORE
          $after  = @(git tag)
          $new    = @($after | Where-Object { $before -notcontains $_ })
          $json   = ConvertTo-Json -Compress -InputObject $new -AsArray
          "tags=$json" >> $env:GITHUB_OUTPUT
          Write-Host "New tags created by chart-releaser: $json"
